[tool.poetry]
name = "specter"
version = "0.1.0"
description = "Passive protective intelligence platform for security operators"
authors = ["Specter Team"]
readme = "README.md"
packages = [{include = "specter"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
httpx = "^0.27"
playwright = "^1.44"
networkx = "^3.3"
cryptography = "^42"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
sqlalchemy = "^2.0"
aiosqlite = "^0.20"
anthropicai = "^0.28"
weasyprint = "^62"
python-multipart = "^0.0.9"

[tool.poetry.dependencies.anthropic]
version = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"
respx = "^0.21"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["specter"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
