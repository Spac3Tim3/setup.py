[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continental-platform"
version = "1.0.0"
description = "The Continental - Professional Security Intelligence Platform"
requires-python = ">=3.11"
authors = [
    {name = "The Continental", email = "concierge@continental.security"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=continental --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
